<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中學時間表編排系統 - 協同與分組教學</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #d1d5db; padding: 8px; text-align: center; }
        .special-row { background-color: #f3f4f6; font-weight: bold; }
        .cell-hover:hover { background-color: #e5e7eb; cursor: pointer; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: bold; }
        .blocked-cell { background-color: #fecaca !important; color: #991b1b; font-weight: bold; background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.5) 10px, rgba(255,255,255,0.5) 20px); }
        .sortable:hover { background-color: #e5e7eb; cursor: pointer; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">

    <div class="max-w-7xl mx-auto bg-white p-6 shadow-lg rounded-lg">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold">NOTRE DAME COLLEGE</h1>
            <h2 class="text-xl">Timetable 排表系統 (支援同房/分房設定)</h2>
        </div>

        <!-- 頁籤導航 -->
        <div class="flex border-b mb-6 overflow-x-auto">
            <button onclick="switchTab('data-tab')" id="btn-data-tab" class="px-4 py-2 tab-active whitespace-nowrap">1. 資料匯入</button>
            <button onclick="switchTab('bind-tab')" id="btn-bind-tab" class="px-4 py-2 text-gray-500 hover:text-blue-600 whitespace-nowrap">2. 課堂總覽與綁定 (Sort & Bind)</button>
            <button onclick="switchTab('timetable-tab')" id="btn-timetable-tab" class="px-4 py-2 text-gray-500 hover:text-blue-600 whitespace-nowrap">3. 排表與鎖堂</button>
        </div>

        <!-- ================= 頁籤 1: 資料匯入 ================= -->
        <div id="data-tab" class="block">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-blue-50 p-4 rounded border border-blue-200">
                    <h3 class="font-bold text-lg mb-2 text-blue-800">從 Excel 貼上課堂資料</h3>
                    <p class="text-sm text-gray-600 mb-2">
                        老師輸入格式說明：<br>
                        單一老師：<code>LPK</code><br>
                        同房共教 (逗號)：<code>LPK,CTY</code> (佔用 1 個課室)<br>
                        分房上課 (斜線)：<code>LPK/CTY</code> (佔用 2 個課室)
                    </p>
                    <textarea id="excel-data" class="w-full h-48 p-2 border border-gray-300 rounded text-sm font-mono" placeholder="範例格式：&#10;4A&#9;X1-PHY&#9;T01&#9;5&#10;4B&#9;X1-CHEM&#9;T02,T03&#9;5&#10;4C&#9;X1-BIO&#9;T04/T05&#9;5&#10;1A&#9;ENG&#9;LPK&#9;6"></textarea>
                    <button onclick="importData()" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full font-bold">匯入資料並生成資料庫</button>
                </div>
                <div class="bg-gray-50 p-4 rounded border border-gray-200 h-64 overflow-y-auto">
                    <h3 class="font-bold text-lg mb-2">系統資料庫狀態</h3>
                    <div id="db-status" class="text-sm text-gray-700"><p>尚未匯入資料...</p></div>
                </div>
            </div>
        </div>

        <!-- ================= 頁籤 2: 課堂總覽與綁定 ================= -->
        <div id="bind-tab" class="hidden">
            <div class="mb-4 flex flex-col md:flex-row justify-between items-center bg-indigo-50 p-4 rounded border border-indigo-200 gap-4">
                <div class="text-sm text-indigo-800">
                    <strong>提示：</strong>點擊表格標題列可以進行排序。勾選需要同時上課的課堂，然後點擊「綁定」。
                </div>
                <button onclick="bindSelectedLessons()" class="bg-indigo-600 text-white px-6 py-2 rounded font-bold hover:bg-indigo-700 shadow">
                    🔗 綁定選取的課堂
                </button>
            </div>

            <div class="overflow-x-auto border rounded">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                        <tr>
                            <th class="w-12 text-center">選取</th>
                            <th class="sortable hover:bg-gray-200 px-4 py-3" onclick="sortTable('class')">班級 ↕</th>
                            <th class="sortable hover:bg-gray-200 px-4 py-3" onclick="sortTable('subject')">科目 ↕</th>
                            <th class="sortable hover:bg-gray-200 px-4 py-3" onclick="sortTable('teacherStr')">老師 ↕</th>
                            <th class="px-4 py-3 text-center">節數</th>
                            <th class="px-4 py-3 text-center">綁定狀態 (Group)</th>
                        </tr>
                    </thead>
                    <tbody id="binding-table-body">
                        <!-- 資料由 JS 動態生成 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ================= 頁籤 3: 排表介面 ================= -->
        <div id="timetable-tab" class="hidden">
            <div class="mb-4 flex flex-col md:flex-row items-center gap-4 bg-yellow-50 p-4 border border-yellow-200 rounded justify-between">
                <div>
                    <label class="font-bold">請選擇老師：</label>
                    <select id="teacher-select" class="border p-2 rounded w-48" onchange="changeTeacher()">
                        <option value="">-- 請先匯入資料 --</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-2 bg-white p-2 rounded border">
                    <span class="font-bold text-sm text-gray-700">滑鼠點擊模式：</span>
                    <label class="flex items-center gap-1 cursor-pointer text-blue-700">
                        <input type="radio" name="click-mode" value="assign" checked> 排課
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer text-red-700 ml-4">
                        <input type="radio" name="click-mode" value="block"> 鎖堂 / 工務 (Block)
                    </label>
                </div>
            </div>

            <div class="overflow-x-auto border-2 border-black p-1">
                <table id="timetable">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="w-16">節數</th>
                            <th class="w-32">時間</th>
                            <th class="w-1/5">Mon</th>
                            <th class="w-1/5">Tue</th>
                            <th class="w-1/5">Wed</th>
                            <th class="w-1/5">Thu</th>
                            <th class="w-1/5">Fri</th>
                        </tr>
                    </thead>
                    <tbody id="timetable-body"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let db = {
            allocations: [], 
            teachers: new Set(), 
            classes: new Set(),
            blockedSlots: {},
            groupCounter: 1 
        };

        let currentSort = { key: 'class', asc: true };

        // 頁籤切換邏輯
        function switchTab(tabId) {
            ['data-tab', 'bind-tab', 'timetable-tab'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById('btn-' + id).className = 'px-4 py-2 text-gray-500 hover:text-blue-600 whitespace-nowrap';
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).className = 'px-4 py-2 tab-active whitespace-nowrap';

            if(tabId === 'bind-tab') renderBindingTable();
            if(tabId === 'timetable-tab') renderTimetable();
        }

        // 1. 匯入資料
        function importData() {
            const rawData = document.getElementById('excel-data').value.trim();
            if (!rawData) { alert("請先貼上資料！"); return; }

            db.allocations = [];
            db.teachers.clear();
            db.classes.clear();
            db.groupCounter = 1;

            const rows = rawData.split('\n');
            let successCount = 0;

            rows.forEach((row, index) => {
                // 支援 tab 或多個空格分隔 (避免逗號被 split 掉，所以不使用逗號 split 欄位)
                const cols = row.split(/\t/).map(col => col.trim());
                
                if (cols.length >= 4) {
                    const className = cols[0];
                    const subject = cols[1];
                    const teacherStr = cols[2]; 
                    const lessons = parseInt(cols[3]);

                    if (className && subject && teacherStr && !isNaN(lessons)) {
                        
                        // 判斷教學模式 (單一 / 同房共教 / 分房上課)
                        let teachMode = 'single';
                        if (teacherStr.includes(',')) {
                            teachMode = 'co-teach';
                        } else if (teacherStr.includes('/')) {
                            teachMode = 'split-room';
                        }

                        // 使用正則表達式分割老師代號 (支援 , 或 /)
                        const teacherArray = teacherStr.split(/[,/]/).map(t => t.trim()).filter(t => t);
                        
                        teacherArray.forEach(t => {
                            db.teachers.add(t);
                            if(!db.blockedSlots[t]) db.blockedSlots[t] = [];
                        });
                        
                        db.allocations.push({ 
                            id: 'alloc_' + index,
                            class: className, 
                            subject: subject, 
                            teachers: teacherArray, 
                            teacherStr: teacherStr, 
                            teachMode: teachMode, // 記錄教學模式
                            lessons: lessons,
                            groupId: null
                        });
                        db.classes.add(className);
                        successCount++;
                    }
                }
            });
            
            document.getElementById('db-status').innerHTML = `<p class="text-green-600 font-bold">✅ 成功匯入 ${successCount} 筆課堂要求！<br>👉 請前往「2. 課堂總覽與綁定」查看。</p>`;
            
            // 更新排表頁面的老師選單
            const select = document.getElementById('teacher-select');
            select.innerHTML = '<option value="">-- 請選擇老師 --</option>';
            Array.from(db.teachers).sort().forEach(t => {
                const option = document.createElement('option');
                option.value = t; option.innerText = t;
                select.appendChild(option);
            });
        }

        // 2. 課堂總覽與綁定
        function renderBindingTable() {
            const tbody = document.getElementById('binding-table-body');
            tbody.innerHTML = '';

            db.allocations.sort((a, b) => {
                let valA = a[currentSort.key];
                let valB = b[currentSort.key];
                if (valA < valB) return currentSort.asc ? -1 : 1;
                if (valA > valB) return currentSort.asc ? 1 : -1;
                return 0;
            });

            const groupColors = ['bg-red-100 text-red-800', 'bg-green-100 text-green-800', 'bg-blue-100 text-blue-800', 'bg-yellow-100 text-yellow-800', 'bg-purple-100 text-purple-800'];

            db.allocations.forEach(alloc => {
                const tr = document.createElement('tr');
                tr.className = 'bg-white border-b hover:bg-gray-50';

                // Checkbox
                const tdCheck = document.createElement('td');
                tdCheck.className = 'text-center px-4 py-2';
                tdCheck.innerHTML = `<input type="checkbox" class="w-4 h-4 text-blue-600 rounded bind-checkbox" value="${alloc.id}">`;
                tr.appendChild(tdCheck);

                // 班級, 科目
                ['class', 'subject'].forEach(key => {
                    const td = document.createElement('td');
                    td.className = 'px-4 py-2';
                    td.innerText = alloc[key];
                    tr.appendChild(td);
                });

                // 老師 (加入標籤顯示同房/分房)
                const tdTeacher = document.createElement('td');
                tdTeacher.className = 'px-4 py-2';
                if (alloc.teachMode === 'co-teach') {
                    tdTeacher.innerHTML = `<span class="font-mono">${alloc.teacherStr}</span> <span class="ml-2 px-2 py-0.5 rounded text-xs font-bold bg-indigo-100 text-indigo-700">同房共教</span>`;
                } else if (alloc.teachMode === 'split-room') {
                    tdTeacher.innerHTML = `<span class="font-mono">${alloc.teacherStr}</span> <span class="ml-2 px-2 py-0.5 rounded text-xs font-bold bg-teal-100 text-teal-700">分房上課</span>`;
                } else {
                    tdTeacher.innerHTML = `<span class="font-mono">${alloc.teacherStr}</span>`;
                }
                tr.appendChild(tdTeacher);

                // 節數
                const tdLessons = document.createElement('td');
                tdLessons.className = 'px-4 py-2 text-center';
                tdLessons.innerText = alloc.lessons;
                tr.appendChild(tdLessons);

                // 綁定狀態
                const tdGroup = document.createElement('td');
                tdGroup.className = 'px-4 py-2 text-center';
                if (alloc.groupId) {
                    const colorNum = parseInt(alloc.groupId.split('-')[1]);
                    const colorClass = groupColors[(colorNum - 1) % groupColors.length];
                    tdGroup.innerHTML = `
                        <span class="px-2 py-1 rounded text-xs font-bold ${colorClass}">${alloc.groupId}</span>
                        <button onclick="unbindLesson('${alloc.id}')" class="ml-2 text-red-500 hover:text-red-700 text-xs underline">解除</button>
                    `;
                } else {
                    tdGroup.innerHTML = `<span class="text-gray-400 text-xs">- 獨立課堂 -</span>`;
                }
                tr.appendChild(tdGroup);

                tbody.appendChild(tr);
            });
        }

        function sortTable(key) {
            if (currentSort.key === key) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.key = key;
                currentSort.asc = true;
            }
            renderBindingTable();
        }

        function bindSelectedLessons() {
            const checkboxes = document.querySelectorAll('.bind-checkbox:checked');
            if (checkboxes.length < 2) {
                alert("請至少勾選 2 堂課進行綁定！");
                return;
            }

            const selectedIds = Array.from(checkboxes).map(cb => cb.value);
            
            const selectedAllocs = db.allocations.filter(a => selectedIds.includes(a.id));
            const firstLessonCount = selectedAllocs[0].lessons;
            const allSameLessons = selectedAllocs.every(a => a.lessons === firstLessonCount);
            
            if (!allSameLessons) {
                const confirmProceed = confirm("警告：你選取的課堂「節數」不一致！\n確定要強制綁定嗎？");
                if (!confirmProceed) return;
            }

            const newGroupId = `Group-${db.groupCounter++}`;
            
            db.allocations.forEach(alloc => {
                if (selectedIds.includes(alloc.id)) {
                    alloc.groupId = newGroupId;
                }
            });

            alert(`成功將 ${checkboxes.length} 堂課綁定為 ${newGroupId}！`);
            renderBindingTable(); 
        }

        function unbindLesson(allocId) {
            const alloc = db.allocations.find(a => a.id === allocId);
            if (alloc) {
                alloc.groupId = null;
                renderBindingTable();
            }
        }

        // 3. 排表介面
        const timeSlots = [
            { id: 'morning', time: '08:10-08:30', label: 'Morning assembly', type: 'full-span' },
            { id: '1', time: '08:50-09:40', type: 'lesson' },
            { id: '2', time: '09:40-10:30', type: 'lesson' },
            { id: 'recess', time: '10:30-10:50', label: 'Recess', type: 'full-span' },
            { id: '3', time: '10:50-11:40', type: 'lesson' },
            { id: '4', time: '11:40-12:30', type: 'lesson' }
        ];
        const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

        function renderTimetable() {
            const tbody = document.getElementById('timetable-body');
            tbody.innerHTML = ''; 
            const currentTeacher = document.getElementById('teacher-select').value;

            timeSlots.forEach(slot => {
                const tr = document.createElement('tr');
                const tdId = document.createElement('td');
                tdId.innerHTML = slot.type === 'full-span' ? '' : slot.id;
                tr.appendChild(tdId);

                const tdTime = document.createElement('td');
                tdTime.innerHTML = slot.time;
                tr.appendChild(tdTime);

                if (slot.type === 'full-span') {
                    const tdSpan = document.createElement('td');
                    tdSpan.colSpan = 5;
                    tdSpan.className = 'special-row';
                    tdSpan.innerHTML = slot.label;
                    tr.appendChild(tdSpan);
                } else {
                    days.forEach(day => {
                        const tdLesson = document.createElement('td');
                        tdLesson.className = 'cell-hover h-16 relative transition-colors duration-200';
                        const slotKey = `${day}-${slot.id}`;
                        
                        if (currentTeacher && db.blockedSlots[currentTeacher] && db.blockedSlots[currentTeacher].includes(slotKey)) {
                            tdLesson.classList.add('blocked-cell');
                            tdLesson.innerHTML = '鎖堂';
                        }

                        tdLesson.onclick = () => handleCellClick(tdLesson, day, slot.id, slotKey);
                        tr.appendChild(tdLesson);
                    });
                }
                tbody.appendChild(tr);
            });
        }

        function handleCellClick(cell, day, slotId, slotKey) {
            const currentTeacher = document.getElementById('teacher-select').value;
            if(!currentTeacher) { alert("請先選擇老師！"); return; }
            const mode = document.querySelector('input[name="click-mode"]:checked').value;

            if (mode === 'block') {
                const blockList = db.blockedSlots[currentTeacher];
                const index = blockList.indexOf(slotKey);
                if (index > -1) blockList.splice(index, 1);
                else blockList.push(slotKey);
                renderTimetable();
            } else {
                if (db.blockedSlots[currentTeacher].includes(slotKey)) {
                    alert("此時段已被鎖堂！"); return;
                }
                alert(`準備為 ${currentTeacher} 在 星期${day} 第 ${slotId} 節 排課！`);
            }
        }

        function changeTeacher() { renderTimetable(); }
    </script>
</body>
</html>
